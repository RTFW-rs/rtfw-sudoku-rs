[package]
name = "rtfw-sudoku-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["progress"]
progress = []

[dependencies]
env_logger = "0.11.10"
log = "0.4.32"
rand = "0.10.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "solve_greedy"
harness = false
